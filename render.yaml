services:
  # Backend: FastAPI Web Service
  - type: web
    name: simple-rag-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt && python -c "from sentence_transformers import CrossEncoder; CrossEncoder('cross-encoder/ms-marco-MiniLM-L-6-v2')"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WORKSPACE_TTL_SECONDS
        value: "3600"
      - key: WORKSPACE_CLEANUP_INTERVAL_SECONDS
        value: "60"
      - key: JINA_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # Frontend: React + Vite Static Site
  - type: static
    name: simple-rag-frontend
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
